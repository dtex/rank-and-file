<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp 3 · Chess column</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,800;0,900;1,500;1,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Libre+Franklin:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Direction: the newspaper chess column. No cards at all: diagrams with captions, hairline rules, big serif headlines.
   Nearly black and white, so the slate board is the only colour on the page apart from one oxblood. */
:root {
  --page: #FBFAF6; --ink: #121212; --grey: #6B6B66; --hair: #C9C7BF; --ox: #8A1C2B;
  --sq-l: #E3E8EB; --sq-d: #8CA2AE; --pw: #FFFFFF; --pb: #1B222A;
  --head: "Playfair Display", "Didot", Georgia, serif;
  --text: "Source Serif 4", Georgia, serif;
  --caps: "Libre Franklin", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 var(--text); }
a { color: inherit; }
.board { display: grid; grid-template-columns: repeat(8, var(--sq)); grid-auto-rows: var(--sq); font-size: calc(var(--sq) * .8); line-height: var(--sq); text-align: center; width: calc(var(--sq) * 8); flex: none; outline: 1px solid var(--ink); outline-offset: 2px; }
.board i { font-style: normal; background: var(--sq-l); color: var(--pb); font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols2", sans-serif; }
.board i.d { background: var(--sq-d); }
.board i.w { color: var(--pw); text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 2px #000; }
.caps { font: 700 11px var(--caps); letter-spacing: .14em; text-transform: uppercase; }

.mast { text-align: center; padding: 20px 48px 0; }
.mast .dl { display: flex; justify-content: space-between; color: var(--grey); border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
.mast h1 { font: 900 64px/1 var(--head); margin: 14px 0 2px; letter-spacing: -.01em; }
.mast h1 em { font-weight: 500; }
.mast .tag { font: italic 400 16px var(--text); color: var(--grey); }
.mast nav { margin-top: 14px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 8px 0; display: flex; justify-content: center; gap: 40px; }
.mast nav a { text-decoration: none; color: var(--grey); }
.mast nav a.on { color: var(--ink); box-shadow: 0 2px 0 var(--ox); }

.label { padding: 26px 48px 10px; color: var(--grey); }
.screen { margin: 0 48px; display: grid; grid-template-columns: 1fr 300px; gap: 36px; border-bottom: 1px solid var(--ink); padding-bottom: 30px; }

/* map: diagrams and captions joined by hairlines */
.viewport { overflow: auto; padding: 10px 6px; }
.canvas { position: relative; }
.canvas svg { position: absolute; left: 0; top: 0; overflow: visible; }
.e { stroke: var(--ink); stroke-width: 1; }
.e.fog { stroke: var(--grey); stroke-dasharray: 1 4; stroke-linecap: round; }
.tile { position: absolute; }
.node { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: var(--page); }
.node .mvn { font: 800 21px/1 var(--head); margin: 10px 0 2px; }
.node .nm { font: italic 400 14px/1.2 var(--text); }
.node .pr { margin-top: 5px; display: flex; gap: 6px; align-items: center; color: var(--grey); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink); }
.pips i.on { background: var(--ink); }
.active .board { outline: 3px solid var(--ox); outline-offset: 3px; }
.active .mvn { color: var(--ox); }
.active .pips i { border-color: var(--ox); } .active .pips i.on { background: var(--ox); }
.done .mvn::after { content: " ✓"; font: 500 15px var(--text); }
.fogn { height: 100%; display: flex; align-items: center; gap: 9px; font: italic 400 14px var(--text); color: var(--grey); background: var(--page); padding-left: 10px; }
.fogn b { width: 20px; height: 20px; border: 1px solid var(--grey); display: grid; place-items: center; font: 800 13px var(--head); font-style: normal; }
.fogn b.b { background: var(--ink); color: var(--page); border-color: var(--ink); }

/* sidebar: a single newspaper column */
.side { border-left: 1px solid var(--ink); padding-left: 26px; }
.side h3 { margin: 0 0 12px; border-top: 3px solid var(--ink); padding-top: 6px; }
.side h3:not(:first-child) { margin-top: 28px; }
.as { border-bottom: 1px solid var(--hair); padding-bottom: 14px; margin-bottom: 14px; }
.as .who { color: var(--ox); }
.as .nm { font: 800 25px/1.08 var(--head); margin: 5px 0 3px; }
.as .mv { font: italic 400 15px var(--text); }
.as .ct { margin-top: 8px; display: flex; gap: 10px; align-items: baseline; }
.as .ct b { font: 900 34px/1 var(--head); } .as .ct b small { font: 500 18px var(--head); color: var(--grey); }
.as p { margin: 6px 0 0; font-size: 14px; color: var(--grey); }
.res { font-size: 14.5px; line-height: 1.35; padding: 7px 0; border-bottom: 1px solid var(--hair); }
.res b { font-weight: 600; } .res span { display: block; color: var(--grey); font-style: italic; }

/* strategy card: an article */
.article { margin: 0 48px 70px; padding-top: 26px; }
.kicker { color: var(--ox); }
.article h2 { font: 900 84px/.98 var(--head); letter-spacing: -.015em; margin: 8px 0 14px; }
.stand { font: italic 400 24px/1.35 var(--text); max-width: 31em; margin: 0 0 22px; }
.byline { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 8px 0; display: flex; gap: 34px; color: var(--grey); }
.byline b { color: var(--ink); }
.body { display: grid; grid-template-columns: auto 1fr 280px; gap: 40px; margin-top: 28px; }
figure { margin: 0; } figcaption { font: italic 400 14px var(--text); color: var(--grey); margin-top: 12px; max-width: 300px; }
figcaption b { font: 700 11px var(--caps); letter-spacing: .14em; text-transform: uppercase; font-style: normal; color: var(--ink); }
.ideas { margin: 0; padding: 0; list-style: none; }
.ideas li { display: grid; grid-template-columns: 62px 1fr; padding: 0 0 16px; margin-bottom: 16px; border-bottom: 1px solid var(--hair); font-size: 19px; line-height: 1.4; }
.ideas li > b { font: italic 500 54px/.8 var(--head); color: var(--ox); }
.ideas small { display: block; font: 700 11px var(--caps); letter-spacing: .12em; text-transform: uppercase; color: var(--grey); margin-top: 7px; }
.mvline { font-size: 17px; margin: 0 0 22px; } .mvline b { font-weight: 600; }
.links { font: 700 11px var(--caps); letter-spacing: .14em; text-transform: uppercase; display: flex; gap: 26px; }
.links a { text-underline-offset: 5px; }
.box { border-top: 3px solid var(--ink); }
.box h4 { margin: 6px 0 10px; }
.pull { font: 900 96px/.9 var(--head); margin: 0; } .pull + p { font: italic 400 16px/1.3 var(--text); margin: 6px 0 18px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; margin-bottom: 26px; }
.tbl td { border-top: 1px solid var(--hair); padding: 6px 0; } .tbl td:last-child { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.else { display: grid; grid-template-columns: 58px 1fr 26px; gap: 6px 10px; align-items: center; font-size: 15px; }
.else i { height: 2px; background: var(--ink); display: block; position: relative; }
.else i::after { content: ""; position: absolute; right: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.else .mine { color: var(--ox); font-style: italic; } .else .mine + i, .else .mine + i::after { background: var(--ox); }
.else span:nth-child(3n) { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="mast">
  <div class="dl caps"><span>Sunday, 22 November 2026</span><span>dtexus · synced 3 min ago</span></div>
  <h1>Rank <em>&amp;</em> File</h1>
  <div class="tag">Chess training for the rest of us</div>
  <nav class="caps"><a class="on" href="#">The Map</a><a href="#">Games</a><a href="#">Openings</a><a href="#">Settings</a></nav>
</header>

<div class="label caps">Map</div>
<div class="screen"><div class="viewport" id="map"></div><aside class="side" id="side"></aside></div>

<div class="label caps">Strategy card</div>
<article class="article" id="card"></article>

<script src="comp.js"></script>
<script>
const { board, sideName, card: c } = Comp
Comp.nav('3-chess-column')
const pips = (n, of) => `<span class="pips">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`

Comp.map(document.getElementById('map'), {
  W: 150, GAP_X: 56, GAP_Y: 12, edge: 'curve',
  height: (n) => (n.fog ? 34 : n.status === 'start' ? 150 : 196),
  out: (it) => [it.n.fog ? 150 : 138, it.n.status === 'start' ? it.h / 2 : 58],
  into: (it) => [it.n.fog ? 4 : 12, it.n.fog || it.n.status === 'start' ? it.h / 2 : 58],
  node: (n) => n.status === 'start'
    ? `<div class="node">${board(n.fen, { sq: 13 })}<div class="nm" style="margin-top:10px">The starting position</div></div>`
    : `<div class="node">${board(n.fen, { flip: n.side === 'b', sq: 13 })}
        <div class="mvn">${n.move}</div><div class="nm">${n.name}</div>
        <div class="pr caps">${pips(n.count, n.target)}</div></div>`,
  fog: (n) => `<div class="fogn"><b class="${n.side}">?</b>${sideName(n.side)} line, unexplored</div>`,
})

document.getElementById('side').innerHTML = `
  <h3 class="caps">Active missions</h3>
  ${Comp.missions.map((m) => `<div class="as">
    <div class="who caps">As ${sideName(m.side)}</div>
    <div class="nm">${m.name}</div><div class="mv">${m.moves}</div>
    <div class="ct"><b>${m.count}<small>/${m.target}</small></b>${pips(m.count, m.target)}</div>
    <p>${m.reach}.</p></div>`).join('')}
  <h3 class="caps">Latest results</h3>
  ${Comp.latest.map((g) => `<div class="res"><b>${g.result}</b> as ${sideName(g.side)}, ${g.opening === 'undiscovered' ? 'in a line not yet uncovered' : g.opening}.<span>${g.verdict}</span></div>`).join('')}
  <p style="font-style:italic;color:var(--grey);font-size:14px;margin-top:16px">4 of 60 openings uncovered, 2 complete.</p>`

const max = Math.max(...c.elsewhere.map((e) => e.count))
const WORDS = ['i', 'ii', 'iii', 'iv']
document.getElementById('card').innerHTML = `
  <div class="kicker caps">Active mission · ${c.count} of ${c.target}</div>
  <h2>${c.name}</h2>
  <p class="stand">${c.blurb}</p>
  <div class="byline caps"><span>Playing <b>${sideName(c.side)}</b></span><span>Line <b style="text-transform:none;letter-spacing:0;font:600 15px var(--text)">${c.moves}</b></span><span>ECO <b>${c.eco}</b></span></div>
  <div class="body">
    <figure>${board(c.fen, { sq: 38 })}<figcaption><b>Diagram</b> &nbsp;The position after ${c.lastMove}, with Black to move. Reach it ${c.target} times as ${sideName(c.side)}.</figcaption></figure>
    <div>
      <p class="mvline"><b>Your moves</b> are ${c.yourMoves.join(' and ')}. <b>Your opponent has to play</b> ${c.theirMoves.join(' and ')}.</p>
      <ol class="ideas">${c.ideas.map((i, n) => `<li><b>${WORDS[n]}</b><span>${i.text}${i.of ? `<small>Followed in ${i.followed} of your last ${i.of} games</small>` : ''}</span></li>`).join('')}</ol>
      <div class="links"><a href="#">Open position on chess.com</a><a href="#">Lichess explorer</a></div>
    </div>
    <aside class="box">
      <h4 class="caps">Your record here</h4>
      <p class="pull">${c.stats.pct}%</p><p>of your ${sideName(c.side)} games reach this position: ${c.stats.reached} of ${c.stats.of}.</p>
      <table class="tbl">
        <tr><td>Won</td><td>${c.stats.win}</td></tr><tr><td>Drawn</td><td>${c.stats.draw}</td></tr><tr><td>Lost</td><td>${c.stats.loss}</td></tr>
        <tr><td>Advice accuracy, last ${c.stats.scored}</td><td>${c.stats.accuracy}%</td></tr>
      </table>
      <h4 class="caps" style="border-top:1px solid var(--ink);padding-top:6px">Where the other ${c.stats.of - c.stats.reached} went</h4>
      <div class="else">${c.elsewhere.map((e) => `<span class="${e.mine ? 'mine' : ''}">${e.move}</span><i style="width:${(e.count / max) * 96}%"></i><span>${e.count}</span>`).join('')}</div>
    </aside>
  </div>`
</script>
</body>
</html>
