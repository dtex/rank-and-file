<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp 1 · Scoresheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Direction: a tournament scoresheet. Cream paper, black ink, one red pencil. Ruled lines do the work boxes usually do. */
:root {
  --paper: #F3EEE2; --paper2: #EAE3D3; --ink: #1B1A17; --faint: #8C8576; --rule: #CFC6B2; --red: #B3261E; --blue: #23408F;
  --sq-l: #E3E8EB; --sq-d: #8CA2AE; --pw: #FFFFFF; --pb: #1B222A;
  --serif: "Old Standard TT", "Iowan Old Style", Georgia, serif;
  --type: "Courier Prime", "Courier New", monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--serif); }
a { color: inherit; }
.board { display: grid; grid-template-columns: repeat(8, var(--sq)); grid-auto-rows: var(--sq); font-size: calc(var(--sq) * .8); line-height: var(--sq); text-align: center; width: calc(var(--sq) * 8); flex: none; outline: 1px solid var(--ink); }
.board i { font-style: normal; background: var(--sq-l); color: var(--pb); font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols2", sans-serif; }
.board i.d { background: var(--sq-d); }
.board i.w { color: var(--pw); text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 2px #000; }

.mast { padding: 22px 40px 0; }
.mast .row { display: flex; align-items: baseline; gap: 28px; border-bottom: 3px double var(--ink); padding-bottom: 10px; }
.brand { font: 700 30px/1 var(--serif); letter-spacing: .14em; text-transform: uppercase; }
.brand small { display: block; font: italic 400 14px var(--serif); letter-spacing: 0; text-transform: none; margin-top: 6px; color: var(--faint); }
.tabs { display: flex; gap: 22px; font: 400 14px var(--type); text-transform: uppercase; letter-spacing: .06em; margin-left: auto; }
.tabs a { text-decoration: none; padding-bottom: 2px; }
.tabs a.on { border-bottom: 2px solid var(--red); }
.sync { font: 400 13px var(--type); color: var(--faint); }

.label { font: 400 12px var(--type); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 26px 40px 8px; }
.screen { margin: 0 40px; border: 1px solid var(--ink); display: grid; grid-template-columns: 1fr 310px; }

/* map: ruled paper */
.viewport { padding: 34px 36px; overflow: auto; background: repeating-linear-gradient(var(--paper) 0 27px, var(--rule) 27px 28px); }
.canvas { position: relative; }
.canvas svg { position: absolute; left: 0; top: 0; overflow: visible; }
.e { stroke: var(--ink); stroke-width: 1.25; }
.e.fog { stroke: var(--faint); stroke-dasharray: 2 5; }
.tile { position: absolute; }
.node { height: 100%; background: var(--paper); border: 1px solid var(--ink); padding: 8px 9px; display: flex; flex-direction: column; position: relative; }
.node .mvn { font: 700 22px/1 var(--type); display: flex; justify-content: space-between; align-items: baseline; }
.node .mvn span { font: 400 11px var(--type); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.node .nm { font: italic 400 14.5px/1.2 var(--serif); margin: 5px 0 8px; min-height: 35px; }
.node .board { align-self: center; }
.node .ft { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font: 400 13px var(--type); }
.tally { display: inline-flex; gap: 3px; }
.tally i { width: 2px; height: 14px; background: var(--rule); transform: rotate(8deg); }
.tally i.on { background: var(--blue); }
.tally i:nth-child(5n) { margin-right: 6px; }
.active .node { box-shadow: 4px 4px 0 var(--ink); }
.stamp { position: absolute; right: 6px; top: 96px; transform: rotate(-12deg); font: 700 15px/1 var(--type); letter-spacing: .12em; text-transform: uppercase; color: var(--red); border: 2px solid var(--red); padding: 4px 7px 2px; background: rgb(243 238 226 / .82); }
.start .node { align-items: center; justify-content: center; gap: 10px; border-style: double; border-width: 3px; }
.fogn { height: 100%; border: 1px dashed var(--faint); color: var(--faint); font: 400 12px var(--type); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--paper); }
.pc { width: 10px; height: 10px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-block; }
.pc.b { background: var(--ink); } .pc.w { background: #fff; }

/* sidebar: a filled-in form */
.side { border-left: 1px solid var(--ink); padding: 22px 22px 26px; background: var(--paper2); }
.side h3 { font: 400 12px var(--type); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 4px; }
.side h3:not(:first-child) { margin-top: 28px; }
.entry { border-top: 1px solid var(--ink); padding: 10px 0 12px; }
.entry .who { font: 400 12px var(--type); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.entry .nm { font: 700 19px/1.15 var(--serif); margin: 3px 0; }
.entry .mv { font: 400 14px var(--type); }
.entry .ct { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font: 400 14px var(--type); }
.entry p { margin: 6px 0 0; font: italic 400 13.5px var(--serif); color: var(--faint); }
.log { width: 100%; border-collapse: collapse; font: 400 13px/1.35 var(--type); }
.log td { border-top: 1px solid var(--rule); padding: 7px 0; vertical-align: top; }
.log td:first-child { width: 22px; }
.log .v { color: var(--faint); display: block; }
.log .hid { font-style: italic; font-family: var(--serif); color: var(--faint); }
.foot { margin-top: 22px; font: italic 400 13.5px var(--serif); color: var(--faint); }

/* strategy card: the scoresheet itself */
.sheet { margin: 0 40px 60px; border: 1px solid var(--ink); padding: 28px 34px 34px; position: relative; }
.fields { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1fr; gap: 0 26px; border-bottom: 3px double var(--ink); padding-bottom: 16px; }
.field label { display: block; font: 400 11px var(--type); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.field div { border-bottom: 1px solid var(--ink); font: 700 26px/1.25 var(--serif); padding: 2px 0 3px; white-space: nowrap; }
.field.sm div { font: 400 20px/1.6 var(--type); color: var(--blue); }
.cols { display: grid; grid-template-columns: auto 1fr 300px; gap: 36px; margin-top: 26px; }
.diagram figcaption { font: italic 400 14px var(--serif); text-align: center; margin-top: 8px; color: var(--faint); }
.diagram { margin: 0; }
.moves { width: 100%; border-collapse: collapse; font: 400 17px var(--type); margin-bottom: 20px; }
.moves th { font: 400 11px var(--type); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); text-align: left; padding: 0 10px 4px; border-bottom: 1px solid var(--ink); }
.moves td { border-bottom: 1px solid var(--rule); padding: 6px 10px; }
.moves td:first-child, .moves th:first-child { width: 34px; color: var(--faint); padding-left: 0; }
.moves .you { color: var(--blue); font-weight: 700; }
.moves .blank { color: var(--rule); }
.blurb { font-size: 17px; line-height: 1.5; margin: 0 0 20px; }
.notes { margin: 0; padding: 0; list-style: none; counter-reset: n; }
.notes li { counter-increment: n; display: grid; grid-template-columns: 30px 1fr; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 16px; }
.notes li::before { content: counter(n) "."; font: 400 16px var(--type); color: var(--faint); }
.pencil { font: 700 13px var(--type); color: var(--red); white-space: nowrap; margin-left: 8px; }
.h { font: 400 11px var(--type); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
.rec { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
.rec td { border-top: 1px solid var(--rule); padding: 7px 0; font-size: 15px; }
.rec td:last-child { text-align: right; font: 700 16px var(--type); }
.else { display: grid; grid-template-columns: 62px 1fr 28px; gap: 6px 10px; align-items: center; font: 400 14px var(--type); }
.else b { height: 9px; background: var(--ink); display: block; }
.else .mine + b { background: var(--red); }
.else .mine { color: var(--red); }
.btns { display: flex; gap: 18px; margin-top: 22px; font: 400 13px var(--type); text-transform: uppercase; letter-spacing: .08em; }
.btns a { text-underline-offset: 4px; }
</style>
</head>
<body>
<header class="mast"><div class="row">
  <div class="brand">Rank and File<small>Chess training for the rest of us</small></div>
  <nav class="tabs"><a class="on" href="#">Map</a><a href="#">Games</a><a href="#">Openings</a><a href="#">Settings</a></nav>
  <span class="sync">dtexus · synced 3 min ago</span>
</div></header>

<div class="label">Map</div>
<div class="screen"><div class="viewport" id="map"></div><aside class="side" id="side"></aside></div>

<div class="label">Strategy card</div>
<div class="sheet" id="card"></div>

<script src="comp.js"></script>
<script>
const { board, sideName, card: c } = Comp
Comp.nav('1-scoresheet')
const tally = (n, of) => `<span class="tally">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`

Comp.map(document.getElementById('map'), {
  W: 152, GAP_X: 58, GAP_Y: 16, edge: 'elbow',
  height: (n) => (n.fog ? 40 : n.status === 'start' ? 150 : 214),
  node: (n) => n.status === 'start'
    ? `<div class="node">${board(n.fen, { sq: 12 })}<span style="font:400 12px var(--type);letter-spacing:.1em;text-transform:uppercase">Start</span></div>`
    : `<div class="node">
        <div class="mvn">${n.move}<span>${sideName(n.side)}</span></div>
        <div class="nm">${n.name}</div>
        ${board(n.fen, { flip: n.side === 'b', sq: 13 })}
        <div class="ft">${tally(n.count, n.target)}<span>${n.count}/${n.target}</span></div>
        ${n.status === 'done' ? '<span class="stamp">Complete</span>' : ''}
      </div>`,
  fog: (n) => `<div class="fogn"><span class="pc ${n.side}"></span>not yet played</div>`,
})

document.getElementById('side').innerHTML = `
  <h3>Active missions</h3>
  ${Comp.missions.map((m) => `<div class="entry">
    <div class="who"><span class="pc ${m.side}"></span> As ${sideName(m.side)}</div>
    <div class="nm">${m.name}</div><div class="mv">${m.moves}</div>
    <div class="ct">${tally(m.count, m.target)}<span>${m.count} of ${m.target}</span></div>
    <p>${m.reach}.</p></div>`).join('')}
  <h3>Latest games</h3>
  <table class="log">${Comp.latest.map((g) => `<tr><td><span class="pc ${g.side}"></span></td>
    <td>${g.result} · ${g.opening === 'undiscovered' ? '<span class="hid">undiscovered</span>' : g.opening}<span class="v">${g.verdict}</span></td></tr>`).join('')}</table>
  <p class="foot">4 of 60 openings uncovered, 2 complete.</p>`

const max = Math.max(...c.elsewhere.map((e) => e.count))
document.getElementById('card').innerHTML = `
  <div class="fields">
    <div class="field"><label>Opening</label><div>${c.name}</div></div>
    <div class="field sm"><label>Playing</label><div>${sideName(c.side)}</div></div>
    <div class="field sm"><label>ECO</label><div>${c.eco}</div></div>
    <div class="field sm"><label>Mission</label><div>${c.count} / ${c.target}</div></div>
  </div>
  <div class="cols">
    <figure class="diagram">${board(c.fen, { sq: 34 })}<figcaption>Position after ${c.lastMove}. Black to move.</figcaption></figure>
    <div>
      <table class="moves"><tr><th></th><th>White (you)</th><th>Black</th></tr>
        <tr><td>1.</td><td class="you">e4</td><td>e5</td></tr>
        <tr><td>2.</td><td class="you">Nf3</td><td class="blank">……</td></tr></table>
      <p class="blurb">${c.blurb}</p>
      <div class="h">Notes</div>
      <ol class="notes">${c.ideas.map((i) => `<li><span>${i.text}${i.of ? `<span class="pencil">✓ ${i.followed} of ${i.of}</span>` : ''}</span></li>`).join('')}</ol>
      <div class="btns"><a href="#">Open on chess.com</a><a href="#">Lichess explorer</a></div>
    </div>
    <div>
      <div class="h">Your record here, as ${sideName(c.side)}</div>
      <table class="rec">
        <tr><td>Games that reached it</td><td>${c.stats.reached} of ${c.stats.of}</td></tr>
        <tr><td>Reach rate</td><td>${c.stats.pct}%</td></tr>
        <tr><td>Won / drawn / lost</td><td>${c.stats.win} / ${c.stats.draw} / ${c.stats.loss}</td></tr>
        <tr><td>Advice accuracy, last ${c.stats.scored}</td><td>${c.stats.accuracy}%</td></tr>
      </table>
      <div class="h">Where the other ${c.stats.of - c.stats.reached} went</div>
      <div class="else">${c.elsewhere.map((e) => `<span class="${e.mine ? 'mine' : ''}">${e.move}</span><b style="width:${(e.count / max) * 100}%"></b><span>${e.count}</span>`).join('')}</div>
    </div>
  </div>`
</script>
</body>
</html>
